          { name: '永州市', data: [72200, 71900, 71800, 83900, 103000] },
          { name: '怀化市', data: [16200, 16500, 16300, 21500, 58753] },
          { name: '娄底市', data: [32900, 41100, 40900, 50300, 68000] },
          { name: '湘西州', data: [11100, 10400, 10300, 13200, 38000] }
        ]
      }
    };

    let currentType = 'vegetable';
    let currentYear = 2024;
    let currentSort = 'desc';

    function formatNum(n) {
      return n.toLocaleString('zh-CN');
    }

    function renderTable() {
      const product = productionData[currentType];
      let cities = [...product.cities];

      // 排序
      const yearIdx = currentYear - 2020;
      if (currentSort === 'desc') {
        cities.sort((a, b) => b.data[yearIdx] - a.data[yearIdx]);
      } else if (currentSort === 'asc') {
        cities.sort((a, b) => a.data[yearIdx] - b.data[yearIdx]);
      } else {
        cities.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));
      }

      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      let total = 0;

      cities.forEach((city, idx) => {
        const growth = ((city.data[4] - city.data[0]) / city.data[0] * 100).toFixed(1);
        const isPositive = parseFloat(growth) >= 0;
        total += city.data[yearIdx];

        const rankClass = idx === 0 ? 'rank-1' : idx === 1 ? 'rank-2' : idx === 2 ? 'rank-3' : 'rank-other';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><span class="rank-badge ${rankClass}">${idx + 1}</span></td>
          <td><strong>${city.name}</strong></td>
          <td class="num">${formatNum(city.data[0])}</td>
          <td class="num">${formatNum(city.data[1])}</td>
          <td class="num">${formatNum(city.data[2])}</td>
          <td class="num">${formatNum(city.data[3])}</td>
          <td class="num"><strong>${formatNum(city.data[4])}</strong></td>
          <td class="num ${isPositive ? 'growth-positive' : 'growth-negative'}">${isPositive ? '↑' : '↓'} ${Math.abs(growth)}%</td>
        `;
        tbody.appendChild(tr);
      });

      // 更新标题和汇总
      document.getElementById('tableTitle').textContent = `${product.name}产量统计表`;
      document.getElementById('tableIcon').textContent = product.icon;
      document.getElementById('tableSummary').textContent = `共 ${cities.length} 条记录 · ${currentYear}年总产量 ${formatNum(total)} 吨`;
    }

    // 品类切换
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentType = this.dataset.type;
        renderTable();
      });
    });

    // 年份切换
    document.getElementById('yearSelect').addEventListener('change', function() {
      currentYear = parseInt(this.value);
      renderTable();
    });

    // 排序切换
    document.getElementById('sortSelect').addEventListener('change', function() {
      currentSort = this.value;
      renderTable();
    });

    function exportData() {
      const table = document.getElementById('dataTable');
      if (!table) return;
      const rows = table.querySelectorAll('tr');
      let csv = [];
      rows.forEach(row => {
        const cells = row.querySelectorAll('th, td');
        const rowData = Array.from(cells).map(c => '"' + c.textContent.replace(/"/g, '""') + '"');
        csv.push(rowData.join(','));
      });
      const csvContent = '\uFEFF' + csv.join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      const now = new Date();
      link.download = '生鲜产量数据_' + now.getFullYear() + (now.getMonth()+1) + now.getDate() + '.csv';
      link.click();
      showToast('数据导出成功');
    }

    function showToast(msg) {
      let toast = document.getElementById('dataToast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'dataToast';
        toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(15,118,110,0.95);color:white;padding:12px 24px;border-radius:10px;font-size:14px;z-index:2000;opacity:0;transition:opacity 0.3s;box-shadow:0 4px 20px rgba(0,0,0,0.15);';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.style.opacity = '1';
      setTimeout(() => { toast.style.opacity = '0'; }, 2500);
    }

    // 统一登录检查
    function checkLogin() {
      const params = new URLSearchParams(window.location.search);
      const urlLoggedIn = params.get('loggedIn');
      const urlUser = params.get('user');
      let isLoggedIn = false;
      let username = '';
      try {
        isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
        username = localStorage.getItem('username') || '';
      } catch(e) {}
      if (urlLoggedIn === '1' && urlUser) {
        isLoggedIn = true;
        username = decodeURIComponent(urlUser);
        try {
          localStorage.setItem('isLoggedIn', 'true');
          localStorage.setItem('username', username);
          localStorage.setItem('loginTime', new Date().toISOString());
        } catch(e) {}
      }
      if (!isLoggedIn) {
        window.location.href = 'login.html';
        return false;
      }
      return true;
    }

    function initUser() {
      if (!checkLogin()) return;
      let username = localStorage.getItem('username') || '管理员';
      try {
        const profile = JSON.parse(localStorage.getItem('userProfile') || '{}');
        if (profile.nickname) username = profile.nickname;
      } catch(e) {}
      document.getElementById('userName').textContent = username;
      document.getElementById('userAvatar').textContent = username.charAt(0).toUpperCase();
    }

    function logout() {
      if (confirm('确定要退出登录吗？')) {
        try {
          localStorage.removeItem('isLoggedIn');
          localStorage.removeItem('username');
          localStorage.removeItem('loginTime');
        } catch(e) {}
        window.location.href = 'login.html';
      }
    }

    initUser();
    renderTable();

    // 侧边栏收起/展开
    function toggleSidebar() {
      const sidebar = document.getElementById('appSidebar');
      const body = document.body;
      sidebar.classList.toggle('collapsed');
      body.classList.toggle('sidebar-collapsed');
      const toggleBtn = sidebar.querySelector('.sidebar-toggle');
      if (sidebar.classList.contains('collapsed')) {
        toggleBtn.textContent = '»';
        try { localStorage.setItem('sidebarCollapsed', 'true'); } catch(e) {}
      } else {
        toggleBtn.textContent = '«';
        try { localStorage.setItem('sidebarCollapsed', 'false'); } catch(e) {}
      }
    }

    // 恢复侧边栏状态
    (function restoreSidebarState() {
      try {
        if (localStorage.getItem('sidebarCollapsed') === 'true') {
          const sidebar = document.getElementById('appSidebar');
          const body = document.body;
          sidebar.classList.add('collapsed');
          body.classList.add('sidebar-collapsed');
          const toggleBtn = sidebar.querySelector('.sidebar-toggle');
          toggleBtn.textContent = '»';
        }
      } catch(e) {}
    })();
  </script>
</body>
