<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c4a6e"/>
      <stop offset="0.5" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="chain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <!-- 圆角背景 -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- 雪花主体（六轴对称） -->
  <g stroke="url(#ice)" stroke-width="2.5" stroke-linecap="round" fill="none">
    <!-- 六条主轴 -->
    <line x1="32" y1="10" x2="32" y2="54"/>
    <line x1="11.7" y1="22" x2="52.3" y2="42"/>
    <line x1="52.3" y1="22" x2="11.7" y2="42"/>
    <!-- 顶端分叉 -->
    <path d="M32 10 L28 15 M32 10 L36 15"/>
    <path d="M32 54 L28 49 M32 54 L36 49"/>
    <!-- 左上分叉 -->
    <path d="M11.7 22 L13.5 28.3 M11.7 22 L18 20.2"/>
    <path d="M52.3 42 L50.5 35.7 M52.3 42 L46 43.8"/>
    <!-- 右上分叉 -->
    <path d="M52.3 22 L50.5 28.3 M52.3 22 L46 20.2"/>
    <path d="M11.7 42 L13.5 35.7 M11.7 42 L18 43.8"/>
  </g>

  <!-- 中心冷链链环（三个交错椭圆环） -->
  <g fill="none" stroke="url(#chain)" stroke-width="2.5">
    <ellipse cx="32" cy="32" rx="7" ry="4.5" transform="rotate(0 32 32)"/>
    <ellipse cx="32" cy="32" rx="7" ry="4.5" transform="rotate(60 32 32)"/>
    <ellipse cx="32" cy="32" rx="7" ry="4.5" transform="rotate(120 32 32)"/>
  </g>

  <!-- 中心高光点 -->
  <circle cx="32" cy="32" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="31" cy="31" r="0.8" fill="#7dd3fc" opacity="0.6"/>
</svg>
