    function renderProjects() {
      const grid = document.getElementById('projectsGrid');
      const region = document.getElementById('regionFilter').value;
      const type = document.getElementById('typeFilter').value;
      const search = document.getElementById('searchInput').value.toLowerCase();

      const filtered = projects.filter(p => {
        if (region !== 'all' && p.region !== region) return false;
        if (type !== 'all' && p.type !== type) return false;
        if (search && !p.name.toLowerCase().includes(search) && !p.city.toLowerCase().includes(search)) return false;
        return true;
      });

      grid.innerHTML = '';
      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'project-card';
        card.onclick = () => openModal(p.id);
        card.innerHTML = `
          <div class="project-banner">
            <span class="project-city-badge">📍 ${p.city.split('市')[0]}市</span>
          </div>
          <div class="project-body">
            <h3 class="project-title">${p.name}</h3>
            <p class="project-desc">${p.desc}</p>
            <div class="project-meta">
              <div class="project-investment">
                ${p.investmentDisp}
                <small>总投资</small>
              </div>
              <span class="project-type-tag">${p.type}</span>
            </div>
            <button class="project-detail-btn" onclick="event.stopPropagation(); openModal(${p.id})">
              查看详情 →
            </button>
          </div>
        `;
        grid.appendChild(card);
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 60px; color: var(--text-3);">暂无符合条件的项目</div>';
      }
    }

    function openModal(id) {
      const p = projects.find(x => x.id === id);
      if (!p) return;

      document.getElementById('modalTitle').textContent = p.name;
      document.getElementById('modalSubtitle').textContent = '📍 ' + p.city;

      const featuresHtml = p.features.map(f => `<span style="display:inline-block; padding:4px 10px; margin:2px; background:rgba(14,165,233,0.1); color:var(--primary); border-radius:6px; font-size:12px;">${f}</span>`).join('');

      document.getElementById('modalBody').innerHTML = `
        <div class="detail-row">
          <div class="detail-label">项目类型</div>
          <div class="detail-value">${p.type} · ${p.region}片区</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">总投资</div>
          <div class="detail-value"><strong style="color:var(--primary); font-size:16px;">${p.investmentDisp}</strong></div>
        </div>
        <div class="detail-row">
          <div class="detail-label">建设地点</div>
          <div class="detail-value">${p.city}</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">项目概况</div>
          <div class="detail-value">${p.content}</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">主要功能</div>
          <div class="detail-value">${featuresHtml}</div>
        </div>
      `;

      document.getElementById('projectModal').classList.add('active');

      // 检查是否已关注
      const followBtn = document.getElementById('followBtn');
      let followed = [];
      try { followed = JSON.parse(localStorage.getItem('followedProjects') || '[]'); } catch(e) {}
      if (followed.includes(p.name)) {
        followBtn.textContent = '已关注 ✓';
        followBtn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
      } else {
        followBtn.textContent = '关注项目';
        followBtn.style.background = '';
      }
    }

    function closeModal() {
      document.getElementById('projectModal').classList.remove('active');
    }

    function followProject() {
      const btn = document.getElementById('followBtn');
      let followed = [];
      try { followed = JSON.parse(localStorage.getItem('followedProjects') || '[]'); } catch(e) {}

      const modalBody = document.getElementById('modalBody');
      const titleEl = document.getElementById('modalTitle');
      const projectName = titleEl ? titleEl.textContent : '';

      if (btn.textContent === '已关注') {
        followed = followed.filter(n => n !== projectName);
        try { localStorage.setItem('followedProjects', JSON.stringify(followed)); } catch(e) {}
        btn.textContent = '关注项目';
        btn.style.background = '';
        showProjToast('已取消关注');
      } else {
        if (!followed.includes(projectName)) followed.push(projectName);
        try { localStorage.setItem('followedProjects', JSON.stringify(followed)); } catch(e) {}
        btn.textContent = '已关注 ✓';
        btn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
        showProjToast('已加入关注列表');
      }
    }

    function showProjToast(msg) {
      let toast = document.getElementById('projToast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'projToast';
        toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(15,118,110,0.95);color:white;padding:12px 24px;border-radius:10px;font-size:14px;z-index:2000;opacity:0;transition:opacity 0.3s;box-shadow:0 4px 20px rgba(0,0,0,0.15);';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.style.opacity = '1';
      setTimeout(() => { toast.style.opacity = '0'; }, 2500);
    }

    // 筛选事件
    document.getElementById('regionFilter').addEventListener('change', renderProjects);
    document.getElementById('typeFilter').addEventListener('change', renderProjects);
    document.getElementById('searchInput').addEventListener('input', renderProjects);

    // 点击弹窗外部关闭
    document.getElementById('projectModal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    // 统一登录检查
    function checkLogin() {
      const params = new URLSearchParams(window.location.search);
      const urlLoggedIn = params.get('loggedIn');
      const urlUser = params.get('user');
      let isLoggedIn = false;
      let username = '';
      try {
        isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
        username = localStorage.getItem('username') || '';
      } catch(e) {}
      if (urlLoggedIn === '1' && urlUser) {
        isLoggedIn = true;
        username = decodeURIComponent(urlUser);
        try {
          localStorage.setItem('isLoggedIn', 'true');
          localStorage.setItem('username', username);
          localStorage.setItem('loginTime', new Date().toISOString());
        } catch(e) {}
      }
      if (!isLoggedIn) {
        window.location.href = 'login.html';
        return false;
      }
      return true;
    }

    function initUser() {
      if (!checkLogin()) return;
      let username = localStorage.getItem('username') || '管理员';
      try {
        const profile = JSON.parse(localStorage.getItem('userProfile') || '{}');
        if (profile.nickname) username = profile.nickname;
      } catch(e) {}
      document.getElementById('userName').textContent = username;
      document.getElementById('userAvatar').textContent = username.charAt(0).toUpperCase();
    }

    function logout() {
      if (confirm('确定要退出登录吗？')) {
        try {
          localStorage.removeItem('isLoggedIn');
          localStorage.removeItem('username');
          localStorage.removeItem('loginTime');
        } catch(e) {}
        window.location.href = 'login.html';
      }
    }

    initUser();
    renderProjects();

    // 侧边栏收起/展开
    function toggleSidebar() {
      const sidebar = document.getElementById('appSidebar');
      const body = document.body;
      sidebar.classList.toggle('collapsed');
      body.classList.toggle('sidebar-collapsed');
      const toggleBtn = sidebar.querySelector('.sidebar-toggle');
      if (sidebar.classList.contains('collapsed')) {
        toggleBtn.textContent = '»';
        try { localStorage.setItem('sidebarCollapsed', 'true'); } catch(e) {}
      } else {
        toggleBtn.textContent = '«';
        try { localStorage.setItem('sidebarCollapsed', 'false'); } catch(e) {}
      }
    }

    // 恢复侧边栏状态
    (function restoreSidebarState() {
      try {
        if (localStorage.getItem('sidebarCollapsed') === 'true') {
          const sidebar = document.getElementById('appSidebar');
          const body = document.body;
          sidebar.classList.add('collapsed');
          body.classList.add('sidebar-collapsed');
          const toggleBtn = sidebar.querySelector('.sidebar-toggle');
          toggleBtn.textContent = '»';
        }
      } catch(e) {}
    })();
  </script>
</body>
